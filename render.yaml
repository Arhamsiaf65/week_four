services:
  - type: web
    name: week4-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: week4-db
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: PORT
        value: "5000"

  - type: web
    name: week4-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: week4-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: week4-db
    databaseName: week4
    user: admin
